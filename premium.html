<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShot Premium | Visual AI Studio</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }
        body {
            background: #050505;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }
        body::before, body::after {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            top: -200px;
            left: -200px;
            animation: smokeMove 12s infinite alternate ease-in-out;
        }
        body::after {
            bottom: -200px;
            right: -200px;
            animation: smokeMove 18s infinite alternate-reverse ease-in-out;
        }
        @keyframes smokeMove {
            0% { transform: translate(0, 0) scale(1); filter: blur(50px); }
            100% { transform: translate(100px, 80px) scale(1.2); filter: blur(80px); }
        }
        .card-container {
            background: rgba(20, 20, 20, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 40px 24px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(212, 175, 55, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            position: relative;
            z-index: 1;
        }
        .avatar-container {
            width: 115px;
            height: 115px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
            background-color: #111;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 11px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .description {
            font-size: 13.5px;
            font-weight: 300;
            color: #e0e0e0;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .portfolio-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #777777;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 35px;
        }
        .portfolio-item {
            width: 100%;
            height: 105px;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.25);
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            background: #111;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-main {
            background: linear-gradient(90deg, #9a7422 0%, #f7efb3 25%, #f1d477 50%, #f7efb3 75%, #9a7422 100%);
            background-size: 200% auto;
            color: #000000;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.35);
            animation: goldGlow 4s infinite linear;
        }
        @keyframes goldGlow {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }
        .btn-main:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.02);
            color: #ffffff;
            border: 1px solid rgba(212, 175, 55, 0.35);
        }
        .btn-secondary:active {
            background: rgba(212, 175, 55, 0.15);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .footer {
            margin-top: 30px;
            font-size: 9px;
            color: #555555;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- Ваш ИИ-портрет (Аватарка) из Imgur -->
    <div class="avatar-container" style="background-image: url('https://imgur.com');"></div>
    
    <h1>CyberShot</h1>
    <div class="subtitle">Visual AI Studio</div>
    
    <p class="description">
        Эксклюзивный ИИ-контент и премиальный визуал для личных брендов и бизнеса. Создаем журнальный стиль дистанционно.
    </p>

    <div class="portfolio-title">Примеры наших работ</div>
    <div class="portfolio-grid">
        <!-- Ваше личное премиум-портфолио из Imgur -->
        <img src="https://imgur.com" alt="Кибер Богиня" class="portfolio-item">
        <img src="https://imgur.com" alt="Жидкое Золото" class="portfolio-item">
        <img src="https://imgur.com" alt="Золотая Камера" class="portfolio-item">
    </div>

    <!-- Полностью рабочие кнопки -->
    <a href="https://vk.me" class="btn btn-main">💬 Написать / Консультация</a>
    <a href="https://vk.com" class="btn btn-secondary" target="_blank">🌐 Группа ВКонтакте</a>
    <a href="https://t.me" class="btn btn-secondary" target="_blank">📢 Telegram-канал</a>
    <a href="tel:+79801781708" class="btn btn-secondary">📞 Позвонить: +7 (980) 178-17-08</a>

    <div class="footer">© CYBERSHOT STUDIO 2026</div>
</div>

</body>
</html>
