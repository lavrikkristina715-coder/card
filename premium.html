<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShot Premium | Visual AI Studio</title>

    <meta
        name="description"
        content="Эксклюзивный ИИ-контент и премиальный визуал для личных брендов и бизнеса."
    >
    <meta name="theme-color" content="#080808">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --background: #080808;
            --card: rgba(18, 18, 18, 0.86);
            --gold: #d4af37;
            --light-gold: #f7efb3;
            --white: #ffffff;
            --text: #e0e0e0;
            --muted: #858585;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: var(--background);
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            padding: 30px 18px;

            position: relative;
            overflow-x: hidden;
            isolation: isolate;

            color: var(--white);
            background: var(--background);
            font-family: "Montserrat", Arial, sans-serif;
        }

        /* Золотой дым */

        body::before,
        body::after {
            content: "";
            position: fixed;
            z-index: -1;

            width: 750px;
            height: 750px;
            border-radius: 50%;
            pointer-events: none;

            background:
                radial-gradient(
                    circle,
                    rgba(212, 175, 55, 0.16) 0%,
                    rgba(212, 175, 55, 0.07) 30%,
                    transparent 70%
                );

            filter: blur(55px);
        }

        body::before {
            top: -300px;
            left: -300px;
            animation: smoke-left 14s infinite alternate ease-in-out;
        }

        body::after {
            right: -300px;
            bottom: -300px;
            animation: smoke-right 18s infinite alternate ease-in-out;
        }

        @keyframes smoke-left {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(140px, 110px) scale(1.25);
            }
        }

        @keyframes smoke-right {
            from {
                transform: translate(0, 0) scale(1);
            }

            to {
                transform: translate(-120px, -100px) scale(1.2);
            }
        }

        .middle-smoke {
            position: fixed;
            top: 35%;
            left: 50%;
            z-index: -1;

            width: 500px;
            height: 500px;
            border-radius: 50%;
            pointer-events: none;

            background:
                radial-gradient(
                    circle,
                    rgba(212, 175, 55, 0.08),
                    transparent 68%
                );

            filter: blur(65px);
            animation: middle-smoke 16s infinite alternate ease-in-out;
        }

        @keyframes middle-smoke {
            from {
                transform: translate(-58%, -42%) scale(0.9);
            }

            to {
                transform: translate(-42%, -58%) scale(1.2);
            }
        }

        /* Основная карточка */

        .card-container {
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 40px 24px;

            position: relative;
            z-index: 1;

            text-align: center;

            background: var(--card);
            border: 1px solid rgba(212, 175, 55, 0.45);
            border-radius: 26px;

            box-shadow:
                0 25px 55px rgba(0, 0, 0, 0.9),
                inset 0 0 25px rgba(212, 175, 55, 0.04),
                0 0 35px rgba(212, 175, 55, 0.07);

            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
        }

        /* Правильный круглый логотип */

        .logo-container {
            width: 125px;
            height: 125px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--gold);
            background:
                radial-gradient(
                    circle,
                    #16130c 0%,
                    #050505 72%
                );

            border: 3px solid var(--gold);
            border-radius: 50%;

            box-shadow:
                0 0 18px rgba(212, 175, 55, 0.4),
                0 0 35px rgba(212, 175, 55, 0.16),
                inset 0 0 18px rgba(212, 175, 55, 0.09);
        }

        .logo-symbol {
            display: block;

            color: var(--gold);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 73px;
            font-weight: 700;
            line-height: 1;

            transform: translateY(-2px);

            text-shadow:
                0 0 10px rgba(212, 175, 55, 0.35),
                0 0 22px rgba(212, 175, 55, 0.18);
        }

        h1 {
            margin-bottom: 6px;

            color: var(--white);
            font-size: 29px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            margin-bottom: 28px;

            color: var(--gold);
            font-size: 11px;
            font-weight: 600;
            line-height: 1.4;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .description {
            margin-bottom: 34px;

            color: var(--text);
            font-size: 13.5px;
            font-weight: 300;
            line-height: 1.65;
        }

        /* Портфолио */

        .portfolio-title {
            margin-bottom: 15px;

            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 35px;
        }

        .portfolio-link {
            position: relative;
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1.15;
            overflow: hidden;

            background: #111111;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;

            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.45);

            transition:
                transform 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .portfolio-link:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.8);

            box-shadow:
                0 12px 24px rgba(0, 0, 0, 0.55),
                0 0 18px rgba(212, 175, 55, 0.14);
        }

        .portfolio-item {
            display: block;
            width: 100%;
            height: 100%;

            object-fit: cover;
            object-position: center;

            transition: transform 0.4s ease;
        }

        .portfolio-link:hover .portfolio-item {
            transform: scale(1.06);
        }

        /* Контактные кнопки */

        .buttons {
            display: grid;
            gap: 15px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 100%;
            min-height: 55px;
            padding: 14px 15px;

            color: var(--white);
            font-size: 14px;
            font-weight: 600;
            line-height: 1.35;
            letter-spacing: 0.25px;
            text-align: center;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.025);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;

            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.3s ease,
                background-color 0.3s ease,
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        .btn-main {
            color: #080808;
            font-weight: 700;

            background:
                linear-gradient(
                    90deg,
                    #967020 0%,
                    #f7efb3 25%,
                    #f1d477 50%,
                    #f7efb3 75%,
                    #967020 100%
                );

            background-size: 200% auto;
            border-color: rgba(247, 239, 179, 0.8);

            box-shadow:
                0 5px 22px rgba(212, 175, 55, 0.34),
                inset 0 1px 1px rgba(255, 255, 255, 0.4);

            animation: gold-button 4s infinite linear;
        }

        @keyframes gold-button {
            from {
                background-position: 0% center;
            }

            to {
                background-position: 200% center;
            }
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 55, 0.12);
            border-color: rgba(212, 175, 55, 0.8);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.35),
                0 0 16px rgba(212, 175, 55, 0.14);
        }

        .btn-main:hover {
            box-shadow: 0 8px 27px rgba(212, 175, 55, 0.42);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:focus-visible,
        .portfolio-link:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 4px;
        }

        .footer {
            margin-top: 30px;

            color: #686868;
            font-size: 9px;
            font-weight: 500;
            letter-spacing: 2px;
        }

        @media (max-width: 380px) {
            body {
                padding: 20px 13px;
            }

            .card-container {
                padding: 32px 17px;
            }

            .portfolio-grid {
                gap: 9px;
            }

            .btn {
                padding-right: 10px;
                padding-left: 10px;
                font-size: 13px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

        </nav>

        <footer class="footer">

        </footer>

    </main>
</body>
</html>
