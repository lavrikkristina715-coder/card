<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CyberShot Premium | Visual AI Studio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            padding: 30px 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            background:
                radial-gradient(
                    circle at top left,
                    rgba(212, 175, 55, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(212, 175, 55, 0.08),
                    transparent 35%
                ),
                #0a0a0a;

            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 400px;
            padding: 40px 24px;

            text-align: center;

            background: #141414;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 24px;

            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .avatar {
            width: 115px;
            height: 115px;
            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            color: #d4af37;
            font-size: 36px;
            font-weight: 700;

            background: linear-gradient(135deg, #111111, #2a2415);
            border: 2px solid #d4af37;
            border-radius: 50%;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        h1 {
            margin: 0 0 6px;

            color: #ffffff;
            font-size: 28px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            margin-bottom: 30px;

            color: #d4af37;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .description {
            margin: 0 0 35px;

            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.6;
        }

        .portfolio-title {
            margin-bottom: 15px;

            color: #888888;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .portfolio {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 35px;
        }

        .portfolio-item {
            width: 100%;
            aspect-ratio: 1 / 1;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            color: #d4af37;
            font-size: 12px;

            background: linear-gradient(135deg, #111111, #2a2415);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 10px;
        }

        .portfolio-item img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .buttons {
            display: grid;
            gap: 16px;
        }

        .btn {
            width: 100%;
            min-height: 54px;
            padding: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            line-height: 1.3;
            text-align: center;
            text-decoration: none;

            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 14px;
        }

        .btn-main {
            color: #000000;
            background: linear-gradient(
                90deg,
                #9a7422,
                #f7efb3,
                #f1d477,
                #9a7422
            );
        }

        .btn:hover {
            border-color: #d4af37;
            transform: translateY(-1px);
        }

        .footer {
            margin-top: 30px;

            color: #666666;
            font-size: 9px;
            letter-spacing: 2px;
        }

        @media (max-width: 380px) {
            body {
                padding: 20px 14px;
            }

            .card {
                padding: 32px 18px;
            }

            .btn {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="avatar">
            <!--
            Когда загрузите изображение в папку images,
            замените букву C следующим кодом:
            <img src="./images/avatar.webp" alt="CyberShot">
            -->
            C
        </div>

        <h1>CyberShot</h1>
        <div class="subtitle">Visual AI Studio</div>

        <p class="description">
            Эксклюзивный ИИ-контент и премиальный визуал для личных
            брендов и бизнеса. Создаём журнальный стиль дистанционно.
        </p>

        <div class="portfolio-title">Примеры наших работ</div>

        <div class="portfolio">
            <div class="portfolio-item">Работа 1</div>
