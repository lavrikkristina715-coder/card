<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShot Premium | Цифровая Визитка</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }
        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: linear-gradient(45deg, transparent 45%, rgba(212, 175, 55, 0.03) 50%, transparent 55%);
            animation: shineBg 8s infinite linear;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes shineBg {
            0% { transform: translate(-30%, -30%) rotate(0deg); }
            100% { transform: translate(-10%, -10%) rotate(360deg); }
        }
        .card-container {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(214, 175, 55, 0.4);
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(214, 175, 55, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            z-index: 1;
        }
        .avatar-container {
            width: 110px;
            height: 110px;
            margin: 0 auto 25px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.25);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #d4af37;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        .description {
            font-size: 14px;
            font-weight: 300;
            color: #e0e0e0;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        .portfolio-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888888;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 35px;
        }
        .portfolio-item {
            width: 100%;
            height: 100px;
            border-radius: 8px;
            border: 1px solid rgba(214, 175, 55, 0.2);
            object-fit: cover;
            transition: all 0.3s ease;
            cursor: pointer;
            background: #111;
        }
        .portfolio-item:active {
            transform: scale(1.05);
            border-color: #d4af37;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            margin-bottom: 18px;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            letter-spacing: 1px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-main {
            background: linear-gradient(90deg, #b38728, #fbf5b7, #da1b60, #b38728);
            background-size: 300% 100%;
            color: #000000;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
            animation: goldFlow 6s infinite linear;
        }
        @keyframes goldFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        .btn-main:active {
            transform: scale(0.98);
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.2);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            color: #ffffff;
            border: 1px solid rgba(214, 175, 55, 0.25);
        }
        .btn-secondary:active {
            background: rgba(214, 175, 55, 0.1);
            border-color: #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }
        .footer {
            margin-top: 30px;
            font-size: 10px;
            color: #555555;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- Ваш ИИ-портрет как главная аватарка -->
    <div class="avatar-container" style="background-image: url('https://vk.ru/photo-240872423_456239103');"></div>
    
    <h1>CyberShot</h1>
    <div class="subtitle">Visual AI Studio</div>
    
    <p class="description">
        Эксклюзивный ИИ-контент и премиальный визуал для личных брендов и бизнеса. Создаем журнальный стиль дистанционно.
    </p>

    <!-- Секция вашего роскошного портфолио -->
    <div class="portfolio-title">Примеры наших работ</div>
    <div class="portfolio-grid">
        <img src="https://vk.ru/photo-240872423_456239102" alt="Девушка с золотом" class="portfolio-item">
        <img src="https://vk.ru/photo-240872423_456239101" alt="Льется золото" class="portfolio-item">
        <img src="https://vk.ru/photo-240872423_456239100" alt="Золотая камера" class="portfolio-item">
    </div>

    <!-- Кнопки действий -->
    <a href="https://vk.me" class="btn btn-main">💬 Написать / Консультация</a>
    <a href="https://vk.ru" class="btn btn-secondary" target="_blank">🌐 Группа ВКонтакте</a>
    <a href="https://t.me" class="btn btn-secondary" target="_blank">📢 Telegram-канал</a>
    <a href="tel:+79801781708" class="btn btn-secondary">📞 Позвонить: +7 (980) 178-17-08</a>

    <div class="footer">© CYBERSHOT STUDIO 2026</div>
</div>

</body>
</html>
