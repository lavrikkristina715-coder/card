<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberShot Studio | Визитка</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card-container {
            background: rgba(25, 25, 25, 0.85);
            border: 1px solid #d4af37;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
        }
        .avatar-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000000;
            font-size: 42px;
            color: #d4af37;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 14px;
            color: #d4af37;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .description {
            font-size: 14px;
            color: #cccccc;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn-main {
            background: linear-gradient(90deg, #d4af37 0%, #f3e5ab 100%);
            color: #000000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
        }
        .btn-main:active {
            transform: scale(0.98);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:active {
            background: rgba(255, 255, 255, 0.1);
        }
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #666666;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- Логотип студии -->
    <div class="avatar-container">$</div>
    
    <h1>CyberShot</h1>
    <div class="subtitle">Студия визуальных решений</div>
    
    <p class="description">
        Премиальный ИИ-контент и визуальные решения для жизни и бизнеса. Журнальный визуал дистанционно.
    </p>

    <!-- Идеальные ссылки по короткому имени сообщества -->
    <a href="https://vk.me" class="btn btn-main" target="_blank">💬 Написать / Консультация</a>
    <a href="https://vk.com" class="btn btn-secondary" target="_blank">🌐 Группа ВКонтакте</a>
    <a href="https://t.me" class="btn btn-secondary" target="_blank">📢 Telegram-канал</a>
    <a href="tel:+79801781708" class="btn btn-secondary">📞 Позвонить: +7 (980) 178-17-08</a>

    <div class="footer">© CYBERSHOT STUDIO 2026</div>
</div>

</body>
</html>
